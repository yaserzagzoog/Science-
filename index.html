<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science — A Curated List of Science Websites</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --text: #14161c;
      --muted: #5b6270;
      --border: #e6e8ef;
      --accent: #4f46e5;
      --accent-2: #06b6d4;
      --chip: #eef0f6;
      --shadow: 0 1px 2px rgba(20,22,28,.04), 0 8px 24px rgba(20,22,28,.06);
      --shadow-hover: 0 2px 4px rgba(20,22,28,.06), 0 16px 40px rgba(79,70,229,.14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d12;
        --surface: #14171f;
        --text: #eef0f6;
        --muted: #9aa2b3;
        --border: #242938;
        --accent: #8b83ff;
        --accent-2: #34d3ee;
        --chip: #1c212e;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
        --shadow-hover: 0 2px 4px rgba(0,0,0,.5), 0 20px 48px rgba(79,70,229,.28);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 760px; margin: 0 auto; padding: clamp(2rem, 5vw, 4.5rem) 1.25rem 4rem; }

    /* Hero */
    .hero { text-align: center; margin-bottom: clamp(1.75rem, 4vw, 2.75rem); }
    .eyebrow {
      display: inline-block;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      line-height: 1.05;
      margin: 0 0 1rem;
      letter-spacing: -.02em;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      color: var(--muted);
      max-width: 32rem;
      margin: 0 auto;
    }

    /* Controls */
    .controls { margin-bottom: 1.5rem; }
    .search {
      position: relative;
      margin-bottom: 1rem;
    }
    .search svg {
      position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none;
    }
    .search input {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .8rem 1rem .8rem 2.8rem;
      box-shadow: var(--shadow);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .search input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .filters { display: flex; flex-wrap: wrap; gap: .5rem; }
    .chip {
      font: inherit;
      font-size: .88rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--chip);
      color: var(--muted);
      padding: .4rem .85rem;
      border-radius: 999px;
      transition: all .15s ease;
    }
    .chip:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); color: var(--text); }
    .chip[aria-pressed="true"] {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }

    /* Cards */
    .sites { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: 1rem; }
    .card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.35rem 1.5rem;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .badge {
      flex: 0 0 auto;
      width: 46px; height: 46px;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 1.35rem;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent-2) 18%, transparent));
      border: 1px solid var(--border);
    }
    .card-body { min-width: 0; }
    .card h2 {
      font-size: 1.18rem;
      margin: .1rem 0 .3rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .card h2 .arrow { color: var(--muted); transition: transform .18s ease, color .18s ease; }
    .card:hover h2 .arrow { transform: translate(3px, -3px); color: var(--accent); }
    .card .desc { color: var(--muted); font-size: .96rem; margin: 0 0 .6rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tag {
      font-size: .72rem;
      color: var(--muted);
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .12rem .5rem;
    }

    .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      margin-top: clamp(2.5rem, 6vw, 4rem);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="eyebrow">Curated collection</span>
      <h1>Science</h1>
      <p>A hand-picked list of the best places to read about mathematics, physics, biology, and the frontiers of discovery.</p>
    </header>

    <section class="controls" aria-label="Filter sites">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="search" type="search" placeholder="Search sites…" autocomplete="off" aria-label="Search sites">
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    </section>

    <main>
      <ul class="sites" id="sites"></ul>
      <p class="empty" id="empty" hidden>No sites match your search.</p>
    </main>

    <footer>
      Built with care · Public domain under the <a href="./UNLICENSE">Unlicense</a>
    </footer>
  </div>

  <script>
    const state = { all: [], query: "", category: "All" };
    const sitesEl = document.getElementById("sites");
    const emptyEl = document.getElementById("empty");
    const filtersEl = document.getElementById("filters");
    const searchEl = document.getElementById("search");

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function render() {
      const q = state.query.trim().toLowerCase();
      const list = state.all.filter((s) => {
        const inCat = state.category === "All" || (s.categories || []).includes(state.category);
        const hay = (s.name + " " + s.description + " " + (s.categories || []).join(" ")).toLowerCase();
        return inCat && (q === "" || hay.includes(q));
      });

      sitesEl.innerHTML = list.map((s) => `
        <li>
          <a class="card" href="${esc(s.url)}" target="_blank" rel="noopener">
            <span class="badge" aria-hidden="true">${esc(s.emoji || "🔗")}</span>
            <span class="card-body">
              <h2>${esc(s.name)} <span class="arrow" aria-hidden="true">↗</span></h2>
              <p class="desc">${esc(s.description)}</p>
              <span class="tags">${(s.categories || []).map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</span>
            </span>
          </a>
        </li>`).join("");

      emptyEl.hidden = list.length !== 0;
    }

    function buildFilters() {
      const cats = ["All", ...new Set(state.all.flatMap((s) => s.categories || []))];
      filtersEl.innerHTML = cats.map((c) =>
        `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === "All"}">${esc(c)}</button>`
      ).join("");
      filtersEl.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.category = btn.dataset.cat;
          filtersEl.querySelectorAll(".chip").forEach((b) =>
            b.setAttribute("aria-pressed", String(b === btn)));
          render();
        });
      });
    }

    searchEl.addEventListener("input", (e) => { state.query = e.target.value; render(); });

    fetch("sites.json")
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => { state.all = data; buildFilters(); render(); })
      .catch(() => {
        sitesEl.innerHTML = "";
        emptyEl.hidden = false;
        emptyEl.textContent = "Could not load sites.json. Serve this page over HTTP (e.g. GitHub Pages) to view it.";
      });
  </script>
</body>
</html>
